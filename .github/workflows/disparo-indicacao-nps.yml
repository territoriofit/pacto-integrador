# Indica Território pós-NPS — promotores (nota 9-10) do NPS próprio
#
# Quem respondeu o NPS com nota alta ONTEM recebe o convite pro programa
# de indicação (1 mês grátis por amigo + 1 pro amigo; brinde aos 5;
# *FIT6/FIT12 por tempo limitado) pela instância "Whats TF 2000".
# Campanha contínua, dedup permanente por lead (1 convite na vida).
# Filtros: só status cliente (inadimplente fora), pula quem relatou
# problema na pesquisa, quem já tem código e quem recebeu a campanha
# julho/26. Máx 15/dia, 90-150s entre envios.
#
# Horário: ~12h BRT seg-sab (cron 09:23 BRT + atraso do GH + HORA_INICIO=12;
# sequência do dia: aniver 10h, cobrança 11h, indicação 12h).
#
# Secrets: SUPABASE_KEY, UAZAPI_TOKEN_2000

name: Disparo Indica Território pós-NPS (WhatsApp)

on:
  schedule:
    - cron: "23 12 * * 1-6"   # 09:23 BRT; atraso do GH + HORA_INICIO=12 => envio ~12h
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = só listar, sem enviar"
        required: false
        default: ""
      max_por_run:
        description: "limite de envios neste run (padrão 15)"
        required: false
        default: ""
      test_to:
        description: "5516... = envia 1 exemplo só pra esse número"
        required: false
        default: ""
      lookback_dias:
        description: "dias pra trás na busca de respostas (padrão 3)"
        required: false
        default: ""
      hora_inicio:
        description: "hora BRT mínima pra começar (padrão 12)"
        required: false
        default: ""
      jitter_max_min:
        description: "jitter máximo de início em minutos (padrão 40)"
        required: false
        default: ""

concurrency:
  group: disparo-indicacao-nps
  cancel-in-progress: false

jobs:
  disparo:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Disparar convite de indicação pós-NPS
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UAZAPI_TOKEN_2000: ${{ secrets.UAZAPI_TOKEN_2000 }}
          HORA_INICIO: ${{ github.event.inputs.hora_inicio || '12' }}
          JITTER_MAX_MIN: ${{ github.event.inputs.jitter_max_min || '40' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_POR_RUN: ${{ github.event.inputs.max_por_run || '15' }}
          LOOKBACK_DIAS: ${{ github.event.inputs.lookback_dias || '3' }}
          TEST_TO: ${{ github.event.inputs.test_to }}
        run: python disparo_indicacao_nps.py
