# Regua de cobranca — parcelas recusadas na 2a tentativa no cartao
#
# Ate 4 mensagens amigaveis, 1 por dia, por aluno (tom "problema na
# operadora do cartao"). Pausa se a consultora ja falou com o aluno depois
# da 1a mensagem; morre sozinha quando a parcela e paga (sai da tabela
# parcelas_atrasadas no sync diario). Whats 2000, 90-150s entre envios.
#
# Textos aprovados pelo Andre em 2026-08-03 (validados com test_to).
# Roda TODO DIA (dias consecutivos fazem parte da cadencia da regua).
#
# Secrets: SUPABASE_KEY, UAZAPI_TOKEN_2000

name: Disparo regua de cobranca (WhatsApp)

on:
  schedule:
    - cron: "20 14 * * *"   # 11:20 BRT todos os dias (apos as campanhas)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = so listar, sem enviar"
        required: false
        default: "1"
      max_por_run:
        description: "limite de envios neste run (padrao 30)"
        required: false
        default: ""
      test_to:
        description: "5516... = envia 1 exemplo so pra esse numero"
        required: false
        default: ""
      max_dias_atraso:
        description: "so parcelas com atraso ate N dias (padrao 30)"
        required: false
        default: ""

concurrency:
  group: disparo-cobranca
  cancel-in-progress: false

jobs:
  disparo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Disparar regua de cobranca
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UAZAPI_TOKEN_2000: ${{ secrets.UAZAPI_TOKEN_2000 }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_POR_RUN: ${{ github.event.inputs.max_por_run || '30' }}
          TEST_TO: ${{ github.event.inputs.test_to }}
          MAX_DIAS_ATRASO: ${{ github.event.inputs.max_dias_atraso || '30' }}
        run: python disparo_cobranca.py
