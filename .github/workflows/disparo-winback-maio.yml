# Campanha win-back — ex-alunos que nao renovaram em maio/2026
#
# Mesmo motor da campanha de abril (disparo_winback.py), com
# CAMPANHA_MES=2026-05 e inicio as 08:00 BRT (pedido do Andre 30/07,
# reforcado 04/08: "comecar a disparar as 8:00"). O cron dispara 05:07 BRT
# de proposito — o scheduler do GH Actions atrasa ~2,5-3h, entao o run cai
# perto das 8h e o HORA_INICIO segura o inicio real; roda seg-sab ate a
# lista esgotar.
#
# Anti-bloqueio: 90-150s entre mensagens e teto de 35/dia POR campanha
# (abril roda 9:00 no mesmo numero — espacamento protege a instancia).
#
# Secrets: SUPABASE_KEY, UAZAPI_TOKEN_2000, PACTO_TOKEN, PACTO_CHAVE

name: Disparo win-back maio (WhatsApp)

on:
  schedule:
    - cron: "7 8 * * 1-6"   # 05:07 BRT; atraso do GH ~2,5-3h + HORA_INICIO=8 => envio ~8h
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = so listar, sem enviar"
        required: false
        default: ""
      max_por_run:
        description: "limite de envios neste run (padrao 35)"
        required: false
        default: ""
      test_to:
        description: "5516... = envia 1 exemplo so pra esse numero"
        required: false
        default: ""

concurrency:
  group: disparo-winback-maio
  cancel-in-progress: false

jobs:
  disparo:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Disparar campanha win-back maio
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UAZAPI_TOKEN_2000: ${{ secrets.UAZAPI_TOKEN_2000 }}
          PACTO_TOKEN: ${{ secrets.PACTO_TOKEN }}
          PACTO_CHAVE: ${{ secrets.PACTO_CHAVE }}
          CAMPANHA_MES: "2026-05"
          HORA_INICIO: "8"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_POR_RUN: ${{ github.event.inputs.max_por_run || '35' }}
          TEST_TO: ${{ github.event.inputs.test_to }}
        run: python disparo_winback.py
