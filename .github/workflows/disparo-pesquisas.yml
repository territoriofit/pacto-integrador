# Disparo WhatsApp das pesquisas de alunos novos (3d e 10d) — WeHelp links
#
# Envia pela instância UazAPI "Whats TF 2000" com 60s+jitter entre mensagens
# (boas práticas anti-bloqueio) e horários ALTERNADOS por dia da semana
# (pedido do André 26/07/2026). O scheduler do Actions atrasa de forma
# imprevisível; o script tem guarda de janela comercial (09:00-19:30 BRT)
# e janela de datas com recuperação (3-5 e 10-12 dias), então run perdido
# é coberto no dia seguinte sem duplicar (dedup em agent_activity).
#
# Horários agendados (BRT = UTC-3):
#   seg/qua/sex 10:40 | ter/qui 14:40 | sáb 12:40 | dom 13:40
#
# Secrets: SUPABASE_KEY, UAZAPI_TOKEN_2000

name: Disparo pesquisas alunos novos (WhatsApp)

on:
  schedule:
    - cron: "40 13 * * 1,3,5"
    - cron: "40 17 * * 2,4"
    - cron: "40 15 * * 6"
    - cron: "40 16 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = só listar, sem enviar"
        required: false
        default: ""

concurrency:
  group: disparo-pesquisas
  cancel-in-progress: false

jobs:
  disparo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Disparar pesquisas (3d e 10d)
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UAZAPI_TOKEN_2000: ${{ secrets.UAZAPI_TOKEN_2000 }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python disparo_pesquisas_whatsapp.py
